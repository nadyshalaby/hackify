name: CI

# The plugin preaches evidence-before-claims but had no automated gate, and the
# 0.4.0 release shipped a stale README badge because validate-dod.sh ran only
# when a human remembered. This workflow runs every gate on push + PR so a
# broken scanner, a DoD regression, or an incomplete mirror manifest fails
# loudly before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (OWASP CICD-SEC-4). With no block at all
# every job inherits the repository default, which is read/write on many repos,
# and nothing here needs write: the workflow reads the tree, runs tests, and runs
# sync-runtimes.sh for real. That last one writes, but only into dist/ inside the
# job's own checkout, which is thrown away when the job ends and is gitignored
# wholesale besides. `contents` governs what the token may do to the REPOSITORY,
# and this workflow never pushes, comments, releases, or calls the GitHub API.
#
# Declared at WORKFLOW level rather than inside the one job on purpose. A job
# added later inherits this restrictive default, whereas a job-level block
# leaves the next job back on the repository default. The safe setting is the
# one you get by forgetting.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: DoD + scanner tests + dist build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check [27d] in the validator asks git which release tags actually
          # exist, so this checkout has to land them. Both keys below are
          # load-bearing and neither works on its own. Measured against this
          # repo's 46 release tags, over all four combinations this action can
          # produce:
          #   depth 1, fetch-tags false: 0 tags, `--no-tags` asks for none.
          #   depth 1, fetch-tags true:  0 tags. Git follows only tags pointing
          #     at the one commit it fetched. A probe tag planted on HEAD did
          #     land; every real release tag sits further back and did not.
          #   depth 0, fetch-tags false: 0 tags, `--no-tags` still suppresses.
          #   depth 0, fetch-tags true:  all 46.
          # Only the last row lets [27d] run, and this file used to be the
          # second: the check shipped silently disabled, taking its written skip
          # on every CI run.
          #
          # Full depth also flips [27d] from fail-open to fail-closed. Its
          # empty-tag-list branch takes a yellow skip when the clone is shallow
          # and a red when it is not, so at depth 1 a broken tag read was
          # indistinguishable from a skip and passed. At depth 0 it reddens.
          #
          # Depth is no longer the tag read's alone. Any suite that replays a
          # blob pinned in scripts/claim_fixtures.json needs the commit that pin
          # sits on, and those sit behind HEAD, so on a shallow clone it reds on
          # a missing object rather than on the defect it exists to catch. Named
          # as the manifest, not as a list of suites: the suites are a list that
          # grows, and every one of them goes through that file. Trimming back to
          # depth 1 disables [27d] AND breaks all of them, and no failure names
          # this key or says why it was set.
          fetch-depth: 0
          fetch-tags: true
          # Keeps GITHUB_TOKEN out of .git/config, where the default leaves it
          # for the rest of the job. Every step below runs shell out of the
          # checked-out tree, which on a fork PR is written by the PR author.
          # `permissions: contents: read` narrows what that token can do, not
          # who can read it back off disk. Nothing here needs git auth: every
          # git call the steps below make is a local read (diff, grep, ls-files,
          # rev-parse, tag), and none of them contacts a remote.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lawkeeper scanner unit tests
        run: python3 skills/lawkeeper/scripts/test_audit.py

      - name: Lawkeeper recall corpus (deterministic-tier precision/recall)
        run: python3 skills/lawkeeper/evals/corpus/run_corpus.py

      - name: Question-bank clarity law
        run: python3 scripts/check_question_clarity.py

      - name: Ban-blocker hook tests
        run: bash hooks/test_block_banned_tokens.sh

      - name: Context-injector hook tests
        run: bash hooks/test_inject_context.sh

      - name: Attribution-blocker hook tests
        run: bash hooks/test_block_ai_attribution.sh

      # Deliberately NOT wired into validate-dod.sh: it costs ~9s, twice the
      # whole validator, and CI is where that time is free. It covers the
      # validator's own ban-token matching engine, so it runs just before the
      # validator that depends on it.
      - name: Ban-token tamper tests (validator matching engine)
        run: bash scripts/test_ban_tokens.sh

      - name: Doc-link line-number tests (check [57] doc-link checker)
        run: python3 scripts/test_doc_link_lines.py

      - name: Doc-anchor tests (check [57] heading-slug and prose anchors)
        run: python3 scripts/test_doc_anchors.py

      - name: Claim-fixture replay tests (pins, manifest, replay scope)
        run: python3 scripts/test_claim_fixtures.py

      - name: Token-declaration tests (check [93] declared-vs-used)
        run: python3 scripts/test_token_declarations.py

      - name: Section-exists tests (check [94] work-doc section resolver)
        run: python3 scripts/test_section_exists.py

      - name: Literal-absent-claim tests (check [95] quoted-phrase resolver)
        run: python3 scripts/test_literal_absent_claims.py

      - name: Claim-check replay tests (measured scoring, not authored)
        run: python3 scripts/test_replay_claim_checks.py

      # The perf-scout's shell loop-body helper is doctrine inside a markdown
      # fence rather than a script, so nothing here ran it until this suite did.
      # It extracts the helper from perf-scout.md and drives that, which is why
      # a green is a claim about what ships.
      - name: Perf-scout awk tests (sh_loop_body heredoc-opener rule)
        run: python3 scripts/test_perf_scout_awk.py

      - name: CI suite-coverage tests (check [97] every suite reachable from CI)
        run: python3 scripts/test_ci_suite_coverage.py

      # The tamper battery for checks [91], [93], [94], [95], [97] and the replay
      # runner. It breaks one branch at a time in a COPY of each fragment and
      # asserts the expected failure message, so it reaches the fail-closed
      # branches a healthy tree can never trip. Two suites are imported into this
      # entrypoint rather than named here, which is the reachability clause [97]
      # resolves by import.
      - name: Tamper battery (fail-closed branches + hostile arguments)
        run: python3 scripts/test_tamper_battery.py

      # WHY THE TREE IS BUILT BEFORE THE VALIDATOR RUNS. Check [56] compares every
      # file the sync copies into dist/<runtime>/ against the canonical source it
      # came from, and dist/ is gitignored wholesale (`*` plus `!.gitignore`), so a
      # CI checkout has the directory and none of the trees. Without this step [56]
      # takes its written skip on every automated run and the release's headline
      # gate ships unexercised. Measured on a fresh `git archive HEAD` unpacked into
      # a clean repo, it printed exactly:
      #   skip no dist/<runtime>/ tree is built ... (791 would be compared)
      #
      # WHAT THE GREEN MEANS HERE, AND WHAT IT DOES NOT. Building the tree in the
      # same job that checks it cannot prove the SHIPPED trees are current, because
      # git holds no shipped tree that could be stale: dist/ is untracked and CI
      # builds it fresh on every run. What it does prove is that the sync writes a
      # byte-identical copy of every file it plans to copy, that it writes every
      # file it plans rather than silently dropping one, and that [56]'s own
      # pairing, floor, exclusion pin and hasher run at all instead of being dead
      # code on every automated path this repo has. The staleness reading survives
      # only on a developer machine, where dist/ persists between syncs. Both halves
      # are written down because a green read for more than it measures is the
      # defect [56] exists to end.
      #
      # THIS REPLACES THE STANDALONE --dry-run STEP that used to run last. The
      # dry-run planning path is still exercised twice inside the validator, by [24]
      # (scripts/validate-dod.d/50-runtimes-and-companions.sh:4) and by [56] itself,
      # so the standalone step was a third invocation of an already-covered path.
      # The one thing it uniquely caught was a planner that exits non-zero, and [56]
      # now reads that exit status itself and reddens naming the planner, which is
      # earlier in the run and says which component failed.
      - name: Build dist/ runtime trees (check [56] needs a real tree to compare)
        run: bash scripts/sync-runtimes.sh

      - name: Definition-of-Done validator
        run: bash scripts/validate-dod.sh
