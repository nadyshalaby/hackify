name: CI

# The plugin preaches evidence-before-claims but had no automated gate, and the
# 0.4.0 release shipped a stale README badge because validate-dod.sh ran only
# when a human remembered. This workflow runs every gate on push + PR so a
# broken scanner, a DoD regression, or an incomplete mirror manifest fails
# loudly before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (OWASP CICD-SEC-4). With no block at all
# every job inherits the repository default, which is read/write on many repos,
# and nothing here needs write: the workflow reads the tree, runs tests, and
# runs sync-runtimes.sh only with --dry-run, which touches nothing. It never
# pushes, comments, releases, or calls the GitHub API.
#
# Declared at WORKFLOW level rather than inside the one job on purpose. A job
# added later inherits this restrictive default, whereas a job-level block
# leaves the next job back on the repository default. The safe setting is the
# one you get by forgetting.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: DoD + scanner tests + sync dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check [27d] in the validator asks git which release tags actually
          # exist, so this checkout has to land them. Both keys below are
          # load-bearing and neither works on its own. Measured against this
          # repo's 46 release tags, over all four combinations this action can
          # produce:
          #   depth 1, fetch-tags false: 0 tags, `--no-tags` asks for none.
          #   depth 1, fetch-tags true:  0 tags. Git follows only tags pointing
          #     at the one commit it fetched. A probe tag planted on HEAD did
          #     land; every real release tag sits further back and did not.
          #   depth 0, fetch-tags false: 0 tags, `--no-tags` still suppresses.
          #   depth 0, fetch-tags true:  all 46.
          # Only the last row lets [27d] run, and this file used to be the
          # second: the check shipped silently disabled, taking its written skip
          # on every CI run.
          #
          # Full depth also flips [27d] from fail-open to fail-closed. Its
          # empty-tag-list branch takes a yellow skip when the clone is shallow
          # and a red when it is not, so at depth 1 a broken tag read was
          # indistinguishable from a skip and passed. At depth 0 it reddens.
          fetch-depth: 0
          fetch-tags: true
          # Keeps GITHUB_TOKEN out of .git/config, where the default leaves it
          # for the rest of the job. Every step below runs shell out of the
          # checked-out tree, which on a fork PR is written by the PR author.
          # `permissions: contents: read` narrows what that token can do, not
          # who can read it back off disk. Nothing here needs git auth: every
          # git call the steps below make is a local read (diff, grep, ls-files,
          # rev-parse, tag), and none of them contacts a remote.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lawkeeper scanner unit tests
        run: python3 skills/lawkeeper/scripts/test_audit.py

      - name: Lawkeeper recall corpus (deterministic-tier precision/recall)
        run: python3 skills/lawkeeper/evals/corpus/run_corpus.py

      - name: Question-bank clarity law
        run: python3 scripts/check_question_clarity.py

      - name: Ban-blocker hook tests
        run: bash hooks/test_block_banned_tokens.sh

      - name: Context-injector hook tests
        run: bash hooks/test_inject_context.sh

      # Deliberately NOT wired into validate-dod.sh: it costs ~9s, twice the
      # whole validator, and CI is where that time is free. It covers the
      # validator's own ban-token matching engine, so it runs just before the
      # validator that depends on it.
      - name: Ban-token tamper tests (validator matching engine)
        run: bash scripts/test_ban_tokens.sh

      - name: Definition-of-Done validator
        run: bash scripts/validate-dod.sh

      - name: Sync-runtimes dry-run (manifest + all 7 runtime targets)
        run: bash scripts/sync-runtimes.sh --dry-run
